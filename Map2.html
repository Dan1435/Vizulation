  <main class="main-content" id="main-content"></main>

  <script src="assets/createjs.min.js"></script>

  <script>
    const targetPuzzle = "Map2"; 

    function loadScreen() {
      const wrapper = document.createElement("div");
      wrapper.className = "puzzle-container";
      const iframe = document.createElement("iframe");
      iframe.src = `games/${targetPuzzle}.html`;
      iframe.setAttribute("title", targetPuzzle);
      wrapper.appendChild(iframe);
      const mount = document.getElementById("main-content");
      mount.innerHTML = "";
      mount.appendChild(wrapper);
    }

    window.onload = function() {
      loadScreen();
    };
  </script>
