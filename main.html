<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | BrightenUp</title>
    <style>
      /* Ensure the browser knows the page should take up the full screen */
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden; /* This removes the scrollbars */
        background-color: #231F20;
      }

      /* Force the Unity Canvas to fill its container (the iframe) */
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block; /* Removes the mysterious gap at the bottom */
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <script src="Build/build21.loader.js"></script>
    <script>
      // Detect mobile devices to adjust the viewport
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.position = "fixed"; // Prevents screen "bounce" on mobile
      }

      // Initialize the Unity Instance
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        /* Pathing points to the Build folder since main.html is now in the root */
        dataUrl: "Build/build21.data.unityweb",
        frameworkUrl: "Build/build21.framework.js.unityweb",
        codeUrl: "Build/build21.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "VizulationGames",
        productName: "BrightenUp",
        productVersion: "1.0",
        // This ensures Unity renders at the same resolution as the CSS box
        devicePixelRatio: window.devicePixelRatio || 1, 
      }).then((unityInstance) => {
        console.log("BrightenUp successfully initialized!");
      }).catch((message) => {
        console.error("Unity Load Error:", message);
      });
    </script>
  </body>
</html>
